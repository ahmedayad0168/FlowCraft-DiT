version: '3.8'

services:
  # API Service
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flowcraft-api
    ports:
      - "8000:8000"
    environment:
      - FLOWCRAFT_CHECKPOINT=/app/checkpoints/flowcraft_step10000.pt
      - FLOWCRAFT_DEVICE=cuda
      - FLOWCRAFT_DTYPE=bfloat16
      - FLOWCRAFT_API_HOST=0.0.0.0
      - FLOWCRAFT_API_PORT=8000
      - FLOWCRAFT_LOG_LEVEL=INFO
    volumes:
      - ./checkpoints:/app/checkpoints
      - ./outputs:/app/outputs
      - ./logs:/app/logs
      - ./config:/app/config
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Streamlit UI Service
  ui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flowcraft-ui
    ports:
      - "8501:8501"
    environment:
      - FLOWCRAFT_CHECKPOINT=/app/checkpoints/flowcraft_step10000.pt
      - FLOWCRAFT_DEVICE=cuda
      - FLOWCRAFT_DTYPE=bfloat16
      - FLOWCRAFT_UI_PORT=8501
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_SERVER_PORT=8501
    volumes:
      - ./checkpoints:/app/checkpoints
      - ./outputs:/app/outputs
      - ./logs:/app/logs
      - ./config:/app/config
    command: ["streamlit", "run", "app/streamlit_app.py", "--server.headless=true", "--server.port=8501"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    depends_on:
      - api
      
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Optional: Nginx reverse proxy
  nginx:
    image: nginx:alpine
    container_name: flowcraft-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - api
      - ui
    restart: unless-stopped
